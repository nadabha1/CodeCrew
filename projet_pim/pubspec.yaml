name: projet_pim
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
    
  # Core utilities
  http: ^1.3.0
  provider: ^6.1.2
  shared_preferences: ^2.5.1
  fluttertoast: ^8.0.9  
  intl: ^0.17.0 
  vector_math: ^2.1.4  # For mock distance calculations

  # UI components
  lottie: ^1.2.1
  flutter_rating_bar: ^4.0.0
  cupertino_icons: ^1.0.8
  table_calendar: ^3.0.8

  # Location/mapping (mock compatible)
  flutter_map: ^6.2.1
  latlong2: ^0.9.1
  geolocator: ^9.0.2    # Only for basic location in mock mode
  geocoding: ^2.0.2     # Optional for mock address lookup

  # Other features
  image_picker: ^0.8.6
  path_provider: ^2.0.15
  url_launcher: ^6.0.10
  web_socket_channel: ^2.3.0
  flutter_local_notifications: ^18.0.1
  socket_io_client: ^2.0.3+1
  location: ^7.0.1
  flutter_datetime_picker: ^1.5.1
  syncfusion_flutter_calendar: ^21.2.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/default_image.png
    - assets/default_profile.png
    - assets/whatsapp.jpeg